/* =========================================================

let currentLang = "ar";


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLang(lang){

  currentLang = lang;

  document.documentElement.lang =
    lang === "ar" ? "ar" : "en";

  document.documentElement.dir =
    lang === "ar" ? "rtl" : "ltr";

  document.body.dir =
    lang === "ar" ? "rtl" : "ltr";


  const langLabel =
    document.getElementById("langLabel");

  if(langLabel){

    langLabel.textContent =
      lang === "ar"
        ? "English"
        : "العربية";

  }


  document
    .querySelectorAll("[data-i18n]")
    .forEach(function(el){

      const key =
        el.getAttribute("data-i18n");

      const value =
        translations[lang][key];

      if(value !== undefined){

        if(value.includes("<strong>")){

          el.innerHTML = value;

        }else{

          el.textContent = value;

        }

      }

    });


  document
    .querySelectorAll("[data-i18n-ph]")
    .forEach(function(el){

      const key =
        el.getAttribute("data-i18n-ph");

      const value =
        translations[lang][key];

      if(value !== undefined){

        el.setAttribute(
          "placeholder",
          value
        );

      }

    });


  document
    .querySelectorAll(
      "#service option[data-i18n]"
    )
    .forEach(function(option){

      const key =
        option.getAttribute("data-i18n");

      const value =
        translations[lang][key];

      if(value !== undefined){

        option.textContent = value;

      }

    });


  document.title =
    lang === "ar"

      ? "الرياض ابوكسي والدهانات | أرضيات ايبوكسي ودهانات في الرياض"

      : "Riyadh Epoxy and Painting | Epoxy Flooring & Painting Services in Riyadh";


  updateAccessibility(lang);

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

function updateAccessibility(lang){

  const menuBtn =
    document.getElementById("menuBtn");

  const langToggle =
    document.getElementById("langToggle");

  const topBtn =
    document.getElementById("topBtn");


  if(menuBtn){

    menuBtn.setAttribute(
      "aria-label",
      lang === "ar"
        ? "فتح قائمة التنقل"
        : "Open navigation menu"
    );

  }


  if(langToggle){

    langToggle.setAttribute(
      "aria-label",
      lang === "ar"
        ? "تغيير اللغة"
        : "Switch language"
    );

  }


  if(topBtn){

    topBtn.setAttribute(
      "aria-label",
      lang === "ar"
        ? "العودة إلى الأعلى"
        : "Scroll back to top"
    );

  }

}


/* =========================================================
   MOBILE MENU
========================================================= */

const menuBtn =
  document.getElementById("menuBtn");

const mainNav =
  document.getElementById("mainNav");


if(menuBtn && mainNav){

  menuBtn.addEventListener(
    "click",
    function(){

      const opened =
        mainNav.classList.toggle("active");

      menuBtn.setAttribute(
        "aria-expanded",
        opened ? "true" : "false"
      );

      menuBtn.innerHTML =
        opened
          ? "✕"
          : "☰";

    }
  );


  document
    .querySelectorAll("#mainNav a")
    .forEach(function(link){

      link.addEventListener(
        "click",
        function(){

          mainNav.classList.remove(
            "active"
          );

          menuBtn.setAttribute(
            "aria-expanded",
            "false"
          );

          menuBtn.innerHTML =
            "☰";

        }
      );

    });

}

    if(!q){
      return;
    }

    q.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".faq-item")
          .forEach(function(other){

            if(other !== item){

              other.classList.remove(
                "open"
              );

            }

          });

        item.classList.toggle("open");

      }
    );

  });

/* =========================================================
   SCROLL TO TOP
   Only runs if top button exists
========================================================= */

const topBtn =
  document.getElementById("topBtn");


if(topBtn){

  window.addEventListener(
    "scroll",
    function(){

      topBtn.style.display =
        window.scrollY > 500
          ? "block"
          : "none";

    }
  );


  topBtn.addEventListener(
    "click",
    function(){

      window.scrollTo({

        top:0,

        behavior:"smooth"

      });

    }
  );

}
